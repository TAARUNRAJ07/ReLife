; PlatformIO Project Configuration for ReLife Hardware Test Rig (Phase HS)
; Standardized build environments and test runner

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include
lib_dir = lib
test_dir = test

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DALLOW_INSECURE_DEV=1
    -DDEV_BUILD=1
    -DSENSOR_SIM=1
    -Iinclude

[env:esp32release]
platform = espressif32
board = esp32dev
framework = arduino
build_flags =
    -DRELEASE_BUILD=1
    -Iinclude

[env:native]
platform = native
test_framework = unity
build_flags =
    -DUNIT_TEST=1
    -DALLOW_INSECURE_DEV=1
    -DSENSOR_SIM=1
    -std=c++11
    -Iinclude
    -Ilib/sensors
    -Ilib/bms_uart
    -Ilib/validator
    -Ilib/timekeeper
    -Ilib/journal
    -Ilib/wifi_client
    -Ilib/delivery
    -Ilib/command_handler
    -Ilib/test_sequencer
    -Ilib/interlock
    -Ilib/display
    -Ilib/config
